    // CONECTAR Y ESCUCHAR BASE DE DATOS EN TIEMPO REAL
    function comenzarSincronizacion() {
      // 1. Escuchar todos los partidos
      onValue(ref(db, 'partidos'), (snapshot) => {
        const data = snapshot.val();
        if (data) {
          state.matches = Object.values(data);
        } else {
          // Si la BD está vacía, cargar fixture inicial estructurado
          const initMap = {};
          FIXTURE_DATA.forEach(m => {
            initMap[m.id] = { ...m, golesLocalReal: null, golesVisitanteReal: null, estado: 'programado' };
          });
          set(ref(db, 'partidos'), initMap);
          state.matches = Object.values(initMap);
        }
        refrescarTodo();
      });

      // 2. Escuchar todas las apuestas
      onValue(ref(db, 'apuestas'), (snapshot) => {
        const data = snapshot.val();
        state.bets = [];
        if (data) {
          Object.keys(data).forEach(uId => {
            Object.keys(data[uId]).forEach(pId => {
              state.bets.push({
                usuarioId: uId,
                partidoId: parseInt(pId),
                golesLocalPred: data[uId][pId].goles_local_pred,
                golesVisitantePred: data[uId][pId].goles_visitante_pred,
                prediccionGanador: data[uId][pId].prediccionGanador,
                puntosGanados: data[uId][pId].puntosGanados || 0
              });
            });
          });
        }
        refrescarTodo();
      });

      // 3. Escuchar todos los usuarios
      onValue(ref(db, 'usuarios'), (snapshot) => {
        const data = snapshot.val();
        state.users = data ? Object.values(data) : [];
        
        // Mantener sesión de LocalStorage sincronizada
        if (state.currentUser) {
          const uCloud = state.users.find(u => u.id === state.currentUser.id);
          if (uCloud) {
            state.currentUser = uCloud;
            localStorage.setItem('polla_current_user', JSON.stringify(uCloud));
          }
        }
        refrescarTodo();
      });
    }

    function refrescarTodo() {
      renderFixtureTabs();
      renderMatches();
      renderRanking();
      renderMiCuenta();
      renderCalendarioFases();
      checkAuth();
      if (state.currentUser?.rol === 'admin') renderInlineAdminBoard();
    }

    // REGISTRO DE PARTICIPANTES
    window.registrarAmigo = function (nombres, apellidos, avatarSeleccionado) {
      if (!nombres || !apellidos) {
        alert("¡Eduardo dice: Pon tus nombres y apellidos completos para cobrar la apuesta! 📝");
        return;
      }
      const nuevoUsuarioRef = push(ref(db, 'usuarios'));
      const userId = nuevoUsuarioRef.key;

      const nuevoUsuario = {
        id: userId, nombres: nombres, apellidos: apellidos,
        foto_url: avatarSeleccionado || 'messi', puntos_totales: 0, rol: "jugador"
      };

      set(nuevoUsuarioRef, nuevoUsuario).then(() => {
        localStorage.setItem('polla_current_user', JSON.stringify(nuevoUsuario));
        state.currentUser = nuevoUsuario;
        location.reload();
      });
    };

    // BOTÓN DE APUESTA RÁPIDA / MARCADOR EXACTO
    window.setWinnerMode = function(matchId, winChar) {
      if (!state.currentUser) { alert("Regístrate en la parte superior para poder apostar. 🛑"); return; }
      const match = state.matches.find(m => m.id === matchId);
      if (match && isMatchLocked(match)) { alert("¡Apuestas cerradas! 🔒"); return; }

      // Cambiar inputs según el modo arcade rápido para que el usuario vea feedback
      const inputL = document.getElementById(`pred-local-${matchId}`);
      const inputV = document.getElementById(`pred-visitante-${matchId}`);
      if (winChar === 'L') { inputL.value = 1; inputV.value = 0; }
      if (winChar === 'V') { inputL.value = 0; inputV.value = 1; }
      if (winChar === 'E') { inputL.value = 1; inputV.value = 1; }
      if (winChar === 'AA') { inputL.value = 2; inputV.value = 2; }

      window.guardarPrediccion(matchId, inputL.value, inputV.value);
    };

    // GUARDAR EN FIREBASE Y ACTIVAR ANIMACIÓN POP
    window.guardarPrediccion = function (partidoId, golesLocal, golesVisitante) {
      if (!state.currentUser) { alert("Regístrate primero en la parte superior para poder apostar. 🛑"); return; }
      const match = state.matches.find(m => m.id === partidoId);
      if (match && isMatchLocked(match)) { alert("¡Este partido ya cerró sus inscripciones! 🔒"); return; }

      if (golesLocal === '' || golesVisitante === '') {
        alert("¡Ingresa goles válidos para mandar la apuesta!");
        return;
      }

      const gL = parseInt(golesLocal);
      const gV = parseInt(golesVisitante);
      let ganador = 'E';
      if (gL > gV) ganador = 'L';
      if (gL < gV) ganador = 'V';

      update(ref(db, `apuestas/${state.currentUser.id}/${partidoId}`), {
        goles_local_pred: gL,
        goles_visitante_pred: gV,
        prediccionGanador: ganador,
        fecha_apuesta: new Date().toISOString(),
        puntosGanados: 0
      }).then(() => {
        // Animaciones y Sonido Arcade Pop
        const card = document.getElementById(`match-card-${partidoId}`);
        if (card) card.classList.add('pop-saved');

        const popAlert = document.getElementById('bet-pop-alert');
        const popContent = document.getElementById('bet-pop-content');
        popAlert.classList.remove('hidden');
        popContent.classList.remove('scale-90', 'opacity-0');
        popContent.classList.add('scale-100', 'opacity-100');

        setTimeout(() => {
          popContent.classList.remove('scale-100', 'opacity-100');
          popContent.classList.add('scale-90', 'opacity-0');
          popAlert.classList.add('hidden');
          if (card) card.classList.remove('pop-saved');
        }, 1200);
      });
    };

    // LÓGICA DE ACTUALIZACIÓN DEL ADMINISTRADOR (EDUARDO QM)
    window.saveRealScoreFromBoard = function(matchId) {
      const gLVal = document.getElementById(`board-local-${matchId}`).value;
      const gVVal = document.getElementById(`board-visitante-${matchId}`).value;

      if (gLVal === '' || gVVal === '') { alert("Eduardo, pon el marcador completo antes de guardar. 🔑"); return; }

      const gLReal = parseInt(gLVal);
      const gVReal = parseInt(gVVal);
      let resultadoReal = 'E';
      if (gLReal > gVReal) resultadoReal = 'L';
      if (gLReal < gVReal) resultadoReal = 'V';

      update(ref(db, `partidos/${matchId}`), {
        golesLocalReal: gLReal,
        golesVisitanteReal: gVReal,
        estado: 'jugado'
      }).then(async () => {
        // Ejecución automática del algoritmo en la nube
        const apuestasSnap = await get(ref(db, 'apuestas'));
        const todasLasApuestas = apuestasSnap.val() || {};

        for (let uId of Object.keys(todasLasApuestas)) {
          if (todasLasApuestas[uId][matchId]) {
            const bet = todasLasApuestas[uId][matchId];
            let pts = 0;
            if (bet.goles_local_pred === gLReal && bet.goles_visitante_pred === gVReal) {
              pts = 3; // Marcador exacto
            } else if (bet.prediccionGanador === resultadoReal) {
              pts = 1; // Solo ganador o empate
            }
            await update(ref(db, `apuestas/${uId}/${matchId}`), { puntosGanados: pts });
          }
        }

        // Acumular puntos en tabla de usuarios para mover la barra de progreso
        const usuariosSnap = await get(ref(db, 'usuarios'));
        const todosLosUsuarios = usuariosSnap.val() || {};
        const apuestasActualizadasSnap = await get(ref(db, 'apuestas'));
        const apuestasActualizadas = apuestasActualizadasSnap.val() || {};

        for (let uId of Object.keys(todosLosUsuarios)) {
          let totalPts = 0;
          if (apuestasActualizadas[uId]) {
            Object.values(apuestasActualizadas[uId]).forEach(b => {
              totalPts += (b.puntosGanados || 0);
            });
          }
          await update(ref(db, `usuarios/${uId}`), { puntos_totales: totalPts });
        }
        confetti({ particleCount: 140, spread: 70, origin: { y: 0.5 } });
      });
    };

        const locked = isMatchLocked(match);
        // Buscar la apuesta del usuario logueado en este dispositivo para meterla en las casillas

        const ganadorPred = miApuesta?.prediccionGanador || '';
        const golesLReal = match.golesLocalReal !== null ? match.golesLocalReal : '-';
        const golesVReal = match.golesVisitanteReal !== null ? match.golesVisitanteReal : '-';

        const codeLocal = COUNTRY_ISO_CODES[match.equipoLocal] || 'un';
        const codeVisitante = COUNTRY_ISO_CODES[match.equipoVisitante] || 'un';

        const card = document.createElement('div');
        card.id = `match-card-${match.id}`;
        card.className = `relative bg-white border-4 border-black rounded-3xl p-5 comic-shadow overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6 ${locked && match.estado !== 'jugado' ? 'locked-card' : ''}`;

        card.innerHTML = `
          <div class="flex-1 w-full flex items-center justify-between gap-4">
            <div class="flex-1 flex flex-col items-center text-center">
              <img src="https://flagcdn.com/w160/${codeLocal}.png" class="w-12 h-8 sm:w-16 sm:h-10 border-2 border-black rounded-lg object-cover shadow">
              <span class="font-black text-black text-xs sm:text-sm mt-2">${match.equipoLocal.toUpperCase()}</span>
              <input type="number" min="0" id="pred-local-${match.id}" value="${golesL}" ${locked ? 'disabled' : ''} class="w-12 h-10 border-4 border-black rounded-xl text-center font-black text-lg mt-2 focus:bg-yellow-50 disabled:bg-gray-100">
            </div>

            <div class="flex flex-col items-center relative select-none">
              ${locked ? '<span class="absolute -top-5 text-lg">🔒</span>' : ''}
              <div class="${match.estado === 'jugado' ? 'bg-green-500 text-white' : 'bg-blue-400 text-white'} font-black text-[10px] uppercase px-2 py-0.5 rounded-full border-2 border-black mb-2">${match.estado === 'jugado' ? 'Finalizado' : match.hora}</div>
              <div class="text-xl font-black text-black">VS</div>
              <div class="mt-2 bg-black text-yellow-300 font-black text-sm px-3 py-1 rounded-lg border-2 border-black tracking-widest comic-shadow">${golesLReal} : ${golesVReal}</div>
            </div>

            <div class="flex-1 flex flex-col items-center text-center">
              <img src="https://flagcdn.com/w160/${codeVisitante}.png" class="w-12 h-8 sm:w-16 sm:h-10 border-2 border-black rounded-lg object-cover shadow">
              <span class="font-black text-black text-xs sm:text-sm mt-2">${match.equipoVisitante.toUpperCase()}</span>
              <input type="number" min="0" id="pred-visitante-${match.id}" value="${golesV}" ${locked ? 'disabled' : ''} class="w-12 h-10 border-4 border-black rounded-xl text-center font-black text-lg mt-2 focus:bg-yellow-50 disabled:bg-gray-100">
            </div>
          </div>

          <div class="w-full md:w-52 flex flex-col justify-center border-t-4 md:border-t-0 md:border-l-4 border-black border-dashed pt-4 md:pt-0 md:pl-4 self-stretch">
            <div class="grid grid-cols-3 gap-1 mb-2 ${locked ? 'hidden' : ''}">
              <button onclick="setWinnerMode(${match.id}, 'L')" class="py-1 border-2 border-black font-black text-[9px] uppercase rounded-lg ${ganadorPred==='L'?'bg-blue-400 text-white':'bg-gray-100'}">🏠 Loc</button>
              <button onclick="setWinnerMode(${match.id}, 'E')" class="py-1 border-2 border-black font-black text-[9px] uppercase rounded-lg ${ganadorPred==='E'?'bg-yellow-400 text-black':'bg-gray-100'}">🤝 Emp</button>
              <button onclick="setWinnerMode(${match.id}, 'V')" class="py-1 border-2 border-black font-black text-[9px] uppercase rounded-lg ${ganadorPred==='V'?'bg-red-400 text-white':'bg-gray-100'}">✈️ Vis</button>
            </div>

            ${match.estado === 'jugado' && miApuesta 
              ? `<div class="bg-yellow-100 border-2 border-black p-2 rounded-xl mb-2 text-center text-xs font-black text-black"> Ganaste +${miApuesta.puntosGanados} PTS ${miApuesta.puntosGanados === 3 ? '🎯🔥' : miApuesta.puntosGanados === 1 ? '👍' : '❌'}</div>` 
              : ''}
            
            ${locked 
              ? `<div class="bg-gray-200 border-4 border-black p-2.5 rounded-xl text-center font-black text-xs text-gray-500 uppercase">🔒 CERRADO</div>` 
              : `<button onclick="window.guardarPrediccion(${match.id}, document.getElementById('pred-local-${match.id}').value, document.getElementById('pred-visitante-${match.id}').value)" class="btn-arcade bg-green-500 border-4 border-black text-white font-black py-2.5 px-4 rounded-xl comic-shadow text-xs uppercase">¡APUESTAR! ⚽</button>`}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // RENDERIZAR EL RANKING LATERAL RETRO
    function renderRanking() {
      const container = document.getElementById('lista-ranking-usuarios');
      if (!container) return;
      container.innerHTML = '';

      const sortedUsers = [...state.users].sort((a, b) => b.puntos_totales - a.puntos_totales);
      document.getElementById('txt-competitors-count').innerText = sortedUsers.length;

      const maxPuntos = Math.max(...sortedUsers.map(u => u.puntos_totales), 1);

      sortedUsers.forEach((u, index) => {
        const posicion = index + 1;
        let medalla = posicion === 1 ? '👑' : posicion === 2 ? '🥈' : posicion === 3 ? '🥉' : posicion;
        const porcentajeBarra = Math.round((u.puntos_totales / maxPuntos) * 100);

        const avatarHtml = CHIBI_AVATARS[u.foto_url] 
          ? `<div class="w-10 h-10 p-0.5 bg-white rounded-xl border-2 border-black">${CHIBI_AVATARS[u.foto_url]}</div>`
          : `<img src="https://api.dicebear.com/7.x/bottts/svg?seed=${u.nombres}" class="w-10 h-10 rounded-xl border-2 border-black bg-white">`;

        const row = document.createElement('div');
        row.className = `flex items-center gap-3 p-2 bg-white border-4 border-black rounded-2xl comic-shadow mb-2 cursor-pointer hover:bg-yellow-100 transition-all ${u.id === state.currentUser?.id ? 'bg-yellow-50 ring-2 ring-yellow-400' : ''}`;
        row.onclick = () => switchUser(u);

        row.innerHTML = `
          <div class="w-8 h-8 flex items-center justify-center font-black text-sm rounded-full bg-black text-white">${medalla}</div>
          <div class="relative">${avatarHtml}</div>
          <div class="flex-1 min-w-0">
            <h4 class="font-black text-xs text-black truncate">${u.nombres} ${u.apellidos} ${u.id === state.currentUser?.id ? '(TÚ)' : ''}</h4>
            <div class="w-full bg-gray-200 border-2 border-black h-4 rounded-lg overflow-hidden mt-1 relative">
              <div class="energy-bar-fill h-full transition-all duration-500" style="width: ${porcentajeBarra}%"></div>
            </div>
          </div>
          <div class="bg-black text-yellow-400 font-black p-1 rounded-xl text-xs min-w-[50px] text-center">🔥 ${u.puntos_totales} Pts</div>
        `;
        container.appendChild(row);
      });
      renderRaceTrack();
    }

    function renderRaceTrack() {
      const container = document.getElementById('race-track-runners');
      if (!container) return;
      container.innerHTML = '';

      const sortedUsers = [...state.users].sort((a, b) => b.puntos_totales - a.puntos_totales);
      const maxPuntos = Math.max(...sortedUsers.map(u => u.puntos_totales), 1);

      sortedUsers.forEach((u, index) => {
        const pct = u.puntos_totales / maxPuntos;
        const bottomPct = 8 + (pct * 74);
        const lanes = [15, 38, 62, 85];
        const leftPct = lanes[index % lanes.length];

        const runner = document.createElement('div');
        runner.className = 'absolute transition-all duration-1000 ease-out flex flex-col items-center';
        runner.style.bottom = `${bottomPct}%`;
        runner.style.left = `${leftPct}%`;
        runner.style.transform = 'translateX(-50%)';

        runner.innerHTML = `
          <div class="bg-black text-white text-[7px] font-black px-1 rounded border border-black leading-none mb-0.5 shadow">${u.nombres.substring(0,6)}</div>
          <div class="w-7 h-7 rounded-full border border-black bg-yellow-300 flex items-center justify-center text-xs shadow ${u.id === state.currentUser?.id ? 'ring-2 ring-white':''}">${CHIBI_AVATARS[u.foto_url] ? '⚽' : '👤'}</div>
        `;
        container.appendChild(runner);
      });
    }

    // PANEL DE ESTADÍSTICAS DEL PARTICIPANTE Y HISTORIAL RECUPERADOS
    function renderMiCuenta() {
      const panel = document.getElementById('mi-cuenta-panel');
      if (!panel || !state.currentUser) return;
      panel.classList.remove('hidden');

      const misBets = state.bets.filter(b => b.usuarioId === state.currentUser.id);
      const betsJugadas = misBets.filter(b => state.matches.find(m => m.id === b.partidoId)?.estado === 'jugado');

      const exactos = betsJugadas.filter(b => b.puntosGanados === 3).length;
      const parciales = betsJugadas.filter(b => b.puntosGanados === 1).length;
      const fallos = betsJugadas.filter(b => b.puntosGanados === 0).length;

      document.getElementById('mi-cuenta-exactos').innerText = exactos;
      document.getElementById('mi-cuenta-parciales').innerText = parciales;
      document.getElementById('mi-cuenta-fallos').innerText = fallos;
      document.getElementById('mi-cuenta-total-pts').innerText = state.currentUser.puntos_totales || 0;

      const maxGlobalPts = Math.max(...state.users.map(u => u.puntos_totales), 1);
      document.getElementById('mi-cuenta-bar').style.width = `${Math.round((state.currentUser.puntos_totales / maxGlobalPts) * 100)}%`;

      const histEl = document.getElementById('mi-cuenta-historial');
      if (betsJugadas.length === 0) {
        histEl.innerHTML = '<div class="text-[10px] text-white/60 font-bold text-center py-2">No hay partidos jugados aún.</div>';
      } else {
        histEl.innerHTML = betsJugadas.map(b => {
          const m = state.matches.find(match => match.id === b.partidoId);
          const icon = b.puntosGanados === 3 ? '🎯' : b.puntosGanados === 1 ? '👍' : '❌';
          return `<div class="bg-white border-2 border-black p-2 rounded-xl text-[10px] text-black font-extrabold mb-1.5 flex justify-between shadow">
            <div>⚽ ${m.equipoLocal} vs ${m.equipoVisitante} (Real: ${m.golesLocalReal}-${m.golesVisitanteReal}) <br><span class="text-gray-500 font-bold">Mi pred: ${b.golesLocalPred}-${b.golesVisitantePred}</span></div>
            <div class="text-black font-black text-xs self-center bg-yellow-300 px-2 py-0.5 rounded-lg border border-black">${icon} +${b.puntosGanados}</div>
          </div>`;
        }).join('');
      }
    }

    // MESA DE CONTROL COMPLETA
    function renderInlineAdminBoard() {
      const container = document.getElementById('admin-inline-matches-list');
      if (!container) return;
      container.innerHTML = '';

      state.matches.forEach(match => {
        const row = document.createElement('div');
        row.className = 'border-4 border-black p-3 bg-white rounded-2xl comic-shadow flex flex-col sm:flex-row items-center justify-between gap-2 mb-2';
        row.innerHTML = `
          <div class="text-xs font-black text-black">${match.equipoLocal} vs ${match.equipoVisitante} (${match.hora})</div>
          <div class="flex items-center gap-2">
            <input type="number" min="0" id="board-local-${match.id}" value="${match.golesLocalReal !== null ? match.golesLocalReal : ''}" class="w-10 h-8 border-2 border-black text-center font-black rounded focus:bg-yellow-50">
            <span>:</span>
            <input type="number" min="0" id="board-visitante-${match.id}" value="${match.golesVisitanteReal !== null ? match.golesVisitanteReal : ''}" class="w-10 h-8 border-2 border-black text-center font-black rounded focus:bg-yellow-50">
            <button onclick="saveRealScoreFromBoard(${match.id})" class="bg-green-500 border-2 border-black text-white font-black text-[10px] px-3 py-1 rounded-xl">💾 GUARDAR</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function checkAuth() {
      if (!state.currentUser) {
        document.getElementById('auth-modal').classList.remove('hidden');
        document.getElementById('mi-cuenta-panel').classList.add('hidden');
      } else {
        document.getElementById('auth-modal').classList.add('hidden');
        renderHeaderUserStatus();
        renderMiCuenta();
        if (state.currentUser.role === 'admin' || state.currentUser.rol === 'admin') {
          document.getElementById('admin-login-gate').classList.add('hidden');
          document.getElementById('admin-control-board-inline').classList.remove('hidden');
        }
      }
    }

    function switchUser(user) {
      state.currentUser = user;
      localStorage.setItem('polla_current_user', JSON.stringify(user));
      refrescarTodo();
    }

    function renderHeaderUserStatus() {
      const container = document.getElementById('user-header-status');
      if (!container || !state.currentUser) return;
      const u = state.currentUser;
      container.innerHTML = `
        <div class="bg-white border-4 border-black p-2 rounded-2xl comic-shadow flex items-center gap-3 select-none">
          <div class="font-black text-xs sm:text-sm text-black uppercase leading-none">🏃‍♂️ ${u.nombres} ${u.apellidos}</div>
          <button onclick="localStorage.removeItem('polla_current_user'); location.reload();" class="text-red-500 font-black text-xs hover:text-red-700">SALIR</button>
        </div>
      `;
    }

    function renderFixtureTabs() {
      const container = document.getElementById('fixture-tabs-container');
      if (!container) return;
      container.innerHTML = '';
      const diasUnicos = ["Jue 11", "Vie 12", "Sáb 13", "Dom 14", "Lun 15", "Mar 16", "Mié 17", "Jue 18", "Vie 19", "Sáb 20", "Dom 21"];
      diasUnicos.forEach(dia => {
        const button = document.createElement('button');
        button.className = `btn-arcade font-black text-xs px-3.5 py-1.5 rounded-xl border-4 border-black select-none ${currentFilteredDay === dia ? 'bg-yellow-400 shadow-none translate-y-0.5' : 'bg-white comic-shadow'}`;
        button.innerText = dia;
        button.onclick = () => { currentFilteredDay = dia; renderFixtureTabs(); renderMatches(); };
        container.appendChild(button);
      });
    }

    function renderAvatarSelector() {
      const container = document.getElementById('avatar-selector-grid');
      if (!container) return;
      container.innerHTML = '';
      Object.keys(CHIBI_AVATARS).forEach(key => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `w-full border-2 border-black rounded-xl p-1 bg-white ${selectedAvatar === key ? 'bg-yellow-100 border-4 border-yellow-500 scale-105' : ''}`;
        btn.innerHTML = CHIBI_AVATARS[key];
        btn.onclick = () => { selectedAvatar = key; renderAvatarSelector(); };
        container.appendChild(btn);
      });
    }

    function renderCalendarioFases() {
      const container = document.getElementById('calendario-fases-container');
      if (!container) return;
      
      const totalPartidos = state.matches.length;
      const finalizados = state.matches.filter(m => m.estado === 'jugado').length;
      const pct = totalPartidos > 0 ? Math.round((finalizados / totalPartidos) * 100) : 0;

      container.innerHTML = `
        <div class="bg-gradient-to-r from-emerald-800 to-emerald-950 border-4 border-black p-4 rounded-2xl flex flex-col justify-between gap-2 col-span-1 sm:col-span-2 xl:col-span-4 shadow">
          <div class="flex justify-between text-white font-black text-xs uppercase tracking-wide">
            <span>🏟️ Progreso General</span>
            <span class="text-yellow-300">${finalizados}/${totalPartidos} Jugados</span>
          </div>
          <div class="w-full bg-white/20 border-2 border-black h-5 rounded-lg overflow-hidden relative">
            <div class="bg-green-400 h-full transition-all duration-700" style="width: ${pct}%"></div>
            <span class="absolute inset-0 flex items-center justify-center text-[10px] font-black text-white tracking-widest">${pct}% COMPLETO</span>
          </div>
        </div>
      `;
    }

    // CONTROL DEL RELOJ EN VIVO DE PERÚ
    setInterval(() => {
      const timeSpan = document.getElementById('txt-simulated-time');
      if (timeSpan) {
        const d = new Date();
        const peruTime = d.toLocaleString("en-US", { timeZone: "America/Lima", hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        timeSpan.innerText = peruTime;
      }
    }, 1000);

    // CONTROL DE SONIDO MOCK
    window.toggleSound = function() {
      const btn = document.getElementById('btn-sound-toggle');
      if(btn.innerText === '🔊') { btn.innerText = '🔇'; } else { btn.innerText = '🔊'; }
    };

    window.handleAdminBottomLogin = function(e) {
      e.preventDefault();
      const user = document.getElementById('admin-bottom-user').value.trim().toLowerCase();
      const pass = document.getElementById('admin-bottom-pass').value.trim();
      const errorMsg = document.getElementById('admin-bottom-error');

      if (user === 'eduardo' && pass === '123456') {
        errorMsg.classList.add('hidden');
        state.currentUser = { id: 'admin-eduardo', nombres: 'Eduardo', apellidos: 'QM', foto_url: 'eduardo', rol: 'admin', puntos_totales: 0 };
        localStorage.setItem('polla_current_user', JSON.stringify(state.currentUser));
        document.getElementById('admin-login-gate').classList.add('hidden');
        document.getElementById('admin-control-board-inline').classList.remove('hidden');
        refrescarTodo();
      } else {
        errorMsg.classList.remove('hidden');
      }
    };

    window.logoutAdminBottom = function() {
      state.currentUser = null;
      localStorage.removeItem('polla_current_user');
      document.getElementById('admin-login-gate').classList.remove('hidden');
      document.getElementById('admin-control-board-inline').classList.add('hidden');
      refrescarTodo();
    };

    window.addEventListener('DOMContentLoaded', () => {
      comenzarSincronizacion();
      renderAvatarSelector();
    });

    document.getElementById('auth-form-user').onsubmit = handleRegistration;
  </script>
